name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # Runs at the top of every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing the merged code and sidebar updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync Upstream and Update Sidebar
        run: |
          # 1. Set up bot identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Safely add or update upstream remote
          if ! git remote | grep -q "^upstream$"; then
            git remote add upstream https://github.com/Ek-Ita-Swa-Iti/EK_ITA_SWA_2026_fall.git
          else
            git remote set-url upstream https://github.com/Ek-Ita-Swa-Iti/EK_ITA_SWA_2026_fall.git
          fi
          git fetch upstream

          # 3. Record state before merging
          BEFORE_MERGE=$(git rev-parse HEAD)

          # 4. Merge teacher's changes
          if ! git merge upstream/master --no-edit; then
            echo "::error::Merge conflict detected between upstream/master and origin/master! Aborting merge."
            git merge --abort || true
            exit 1
          fi

          # 5. Check if upstream brought new commits or if manually triggered
          AFTER_MERGE=$(git rev-parse HEAD)

          if [ "$BEFORE_MERGE" != "$AFTER_MERGE" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Upstream changes detected or workflow manually triggered. Updating sidebar..."
            python3 .github/scripts/update_sidebar.py

            # 6. Commit _sidebar.md if changed
            SIDEBAR_CHANGED=false
            if [ -n "$(git status --porcelain _sidebar.md)" ]; then
              echo "Sidebar updated by script. Committing changes..."
              git add _sidebar.md
              git commit -m "Auto-update _sidebar.md with session changes [skip ci]"
              SIDEBAR_CHANGED=true
            fi

            # 7. Push all changes to origin master
            echo "Pushing commits to origin master..."
            git push origin master

            # 8. GitHub Step Summary
            echo "### Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
            echo "Successfully synced upstream changes to master." >> $GITHUB_STEP_SUMMARY
            if [ "$SIDEBAR_CHANGED" = true ]; then
              echo "- \`_sidebar.md\` was automatically updated and committed." >> $GITHUB_STEP_SUMMARY
            else
              echo "- \`_sidebar.md\` checked; already up to date." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Already up to date. No new commits pulled from upstream."
            echo "### Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
            echo "Everything is already up to date. No new upstream commits." >> $GITHUB_STEP_SUMMARY
          fi

